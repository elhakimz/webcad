# WebCAD Engine Container (WC-EC) — docker-compose
# Services: gateway (Connect + gRPC), kernel (OCCT), nginx (HTTP/2 termination),
# vite (dev server), postgres, minio
#
# Local development target. OCCT uses conda-forge prebuilt (Dockerfile.kernel.conda)
# — no from-source OCCT build.

services:
  # ------------------------------------------------------------------
  # nginx — HTTP/2 TLS termination, Connect proxy, CORS
  # ------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - gateway
      - vite
    networks:
      - webcad

  # ------------------------------------------------------------------
  # vite — Vite dev server (static assets, HMR, engine proxy in dev)
  # ------------------------------------------------------------------
  vite:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_GATEWAY_URL=https://localhost/webcad.engine.v1.EngineGatewayService
      - NODE_ENV=development
    networks:
      - webcad

  # ------------------------------------------------------------------
  # gateway — Connect server (browser-facing) + gRPC client (kernel-facing)
  # ------------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_PORT=8080
      - KERNEL_SOCKET=/var/run/webcad/kernel.sock
      - KERNEL_TLS=mTLS
      - MAX_MESSAGE_SIZE=16777216      # 16 MiB hard cap
      - INLINE_REQUEST_LIMIT=4194304   # 4 MiB
      - INLINE_RESPONSE_LIMIT=4194304  # 4 MiB
      - CHUNK_SIZE_LIMIT=1048576       # 1 MiB
      - PER_SESSION_BLOB_QUOTA=67108864 # 64 MiB
      - RESULT_ID_TTL=300              # 5 minutes
      - UPLOAD_TTL=900                 # 15 minutes
      - REORDER_BUFFER_TIMEOUT=5       # 5 seconds (proposed default)
      - REORDER_BUFFER_SIZE=1024       # events (proposed default)
      - DEDUPE_TTL=600                 # 10 minutes (proposed default)
      - DEDUPE_CAP=10000               # entries (proposed default)
      - JWT_SECRET=changeme-in-prod
      - JWT_ISSUER=webcad-gateway
    volumes:
      - ./certs:/etc/webcad/certs:ro
      - webcad-kernel-socket:/var/run/webcad
    depends_on:
      - kernel
    networks:
      - webcad

  # ------------------------------------------------------------------
  # kernel — OCCT geometry kernel (gRPC server, conda-forge prebuilt)
  # ------------------------------------------------------------------
  kernel:
    build:
      context: .
      dockerfile: Dockerfile.kernel.conda
    environment:
      - KERNEL_PORT=50051
      - KERNEL_SOCKET=/var/run/webcad/kernel.sock
      - KERNEL_LOG_LEVEL=info
    volumes:
      - webcad-kernel-socket:/var/run/webcad
    networks:
      - webcad

  # ------------------------------------------------------------------
  # postgres — PostgreSQL database (for WC-EC-37/38/39)
  # ------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=webcad
      - POSTGRES_USER=webcad
      - POSTGRES_PASSWORD=webcad
    volumes:
      - webcad-postgres-data:/var/lib/postgresql/data
    networks:
      - webcad

  # ------------------------------------------------------------------
  # minio — S3-compatible object storage (for WC-EC-39 file API)
  # ------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - webcad-minio-data:/data
    networks:
      - webcad
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  webcad-kernel-socket:
  webcad-postgres-data:
  webcad-minio-data:

networks:
  webcad:
    driver: bridge