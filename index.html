
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>WebCAD - WebCAD 2.18</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="drawing-editor">
    <div id="app">
    <div id="status-bar">
      <div id="layer-info">Layer 0</div>
      <div id="drafting-aids">
        <span id="tag-snap" class="status-tag">SNAP</span>
        <span id="tag-grid" class="status-tag">GRID</span>
        <span id="tag-ortho" class="status-tag">ORTHO</span>
        <span id="tag-osnap" class="status-tag">OSNAP</span>
        <span id="tag-otrack" class="status-tag">OTRACK</span>
      </div>
      <div id="coords-info">0.0000, 0.0000</div>
    </div>
    <div id="main-area">
      <div id="viewport-container">
        <canvas id="c"></canvas>
      </div>

      <div id="docking-pane"></div>
    </div>
    <div id="command-area">
      <div id="command-log"></div>
      <div id="command-input-container">
        <span id="command-prompt">Command:</span>
        <input id="cmd" autocomplete="off" />
      </div>
    </div>
  </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
