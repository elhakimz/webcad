# nginx configuration for WebCAD gRPC/Connect transport
#
# - Terminates HTTP/2 (TLS) from the browser
# - Proxies Connect (POST /webcad.engine.v1.EngineGatewayService/*) to the gateway
# - proxy_buffering off + long read timeout for server-streaming (Subscribe, StreamResult)
# - CORS headers only for cross-origin deployments (same-origin preferred)
# - gRPC (gateway->kernel) is internal, NOT proxied through nginx

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Map $http2 to detect HTTP/2 connections (for access logs, etc.)
    map $http2 $http2_alpn {
        default "";
        2 "h2";
    }

    # Upstream: WebCAD gateway (Connect + gRPC-Web)
    upstream webcad_gateway {
        server gateway:8080;
    }

    # Upstream: Vite dev server (for static assets + engine proxy in dev)
    upstream vite_dev {
        server vite:5173;
    }

    # Logging
    log_format combined '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'h2=$http2_alpn session=$http_x_session_id';

    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    # ------------------------------------------------------------------
    # Server: HTTPS + HTTP/2 (browser-facing, Connect protocol)
    # ------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name localhost webcad.local;

        # TLS certificates (mkcert in dev, Let's Encrypt in prod)
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # COOP/COEP for SharedArrayBuffer / WASM threads
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        # CORS — only enable for genuine cross-origin deployments.
        # Same-origin (Vite proxy / nginx same host) does NOT need CORS.
        # Uncomment the block below for cross-origin:
        #
        # add_header Access-Control-Allow-Origin "https://client.example.com" always;
        # add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        # add_header Access-Control-Allow-Headers "Authorization, Content-Type, x-session-id" always;
        # add_header Access-Control-Max-Age 86400 always;
        #
        # if ($request_method = 'OPTIONS') {
        #     add_header Content-Length 0;
        #     add_header Content-Type 204;
        #     return 204;
        # }

        # ------------------------------------------------------------------
        # Connect REST endpoints (plain HTTP POST, unary + server-streaming)
        # ------------------------------------------------------------------
        location /webcad.engine.v1.EngineGatewayService/ {
            proxy_pass http://webcad_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Session-Id $http_x_session_id;

            # No buffering for server-streaming (Subscribe, StreamResult)
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;

            # Long read timeout for slow streams (heartbeat every 15s)
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Pass-through gRPC/Connect headers
            proxy_set_header Content-Type $content_type;
            proxy_set_header Authorization $http_authorization;

            # Max request body 4 MiB (Connect read limit)
            client_max_body_size 4m;
        }

        # ------------------------------------------------------------------
        # Vite dev proxy (static assets + HMR)
        # ------------------------------------------------------------------
        location / {
            proxy_pass http://vite_dev;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    # ------------------------------------------------------------------
    # Server: HTTP redirect to HTTPS
    # ------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}