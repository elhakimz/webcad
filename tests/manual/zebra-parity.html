<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zebra TSL parity</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1216; color: #e8eef5; font: 14px/1.4 system-ui, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
      figure { margin: 0; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
      canvas { flex: 1; width: 100%; min-height: 0; display: block; border: 1px solid #2a3542; border-radius: 6px; }
      figcaption { color: #9fb0c3; }
      #status { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); padding: 6px 10px; background: #000a; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <canvas id="webgl"></canvas>
        <figcaption>WebGLRenderer + WebGLNodesHandler</figcaption>
      </figure>
      <figure>
        <canvas id="webgpu"></canvas>
        <figcaption id="webgpu-caption">WebGPURenderer</figcaption>
      </figure>
    </main>
    <div id="status">booting…</div>
    <script type="module" src="./zebra-parity.ts"></script>
  </body>
</html>
